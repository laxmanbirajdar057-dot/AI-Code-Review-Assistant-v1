# ---------- Server ----------
server.port=8080

# ---------- Database (MySQL) ----------
# Fix: host/port/db-name were hardcoded to localhost:3306 — inside Docker the
# app needs to reach the "mysql" service by its container name instead.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:codereviewassistant}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}

jwt.expiration.ms=3600000

# ---------- Gemini API ----------
gemini.api.key=${GEMINI_API_KEY}

# ---------- App ----------
# Public base URL of this deployment, used to build the webhook URL shown to
# users (e.g. https://your-deployed-domain.com). Defaults to localhost for
# local dev.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Comma-separated list of origins allowed to call this API with credentials.
# Defaults to common local dev ports only — set APP_ALLOWED_ORIGINS to your
# real frontend origin(s) before deploying.
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# ---------- Webhook secret encryption ----------
# Base64-encoded 256-bit AES key used to encrypt Repository.webhookSecret at
# rest. Generate one with: openssl rand -base64 32
webhook.secret.encryption.key=${WEBHOOK_SECRET_ENCRYPTION_KEY}

# ---------- Async ----------
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50

# ---------- Observability ----------
# Only "health" is exposed — actuator can leak internals (env vars, beans,
# etc.) if you open more endpoints than you actually need publicly.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Logging ----------
# Fix: was DEBUG for both, which leaks request/header/token detail into logs.
# INFO is safe for normal operation; bump to DEBUG locally when you need it.
logging.level.org.springframework.security=INFO
logging.level.com.laxman.codereviewassistant=INFO

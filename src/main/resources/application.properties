# ---------- Server ----------
server.port=8080

# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/codereviewassistant?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}

jwt.expiration.ms=3600000

# ---------- Gemini API ----------
gemini.api.key=${GEMINI_API_KEY}

# ---------- App ----------
# Public base URL of this deployment, used to build the webhook URL shown to
# users (e.g. https://your-deployed-domain.com). Defaults to localhost for
# local dev.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ---------- Webhook secret encryption ----------
# Base64-encoded 256-bit AES key used to encrypt Repository.webhookSecret at
# rest. Generate one with: openssl rand -base64 32
webhook.secret.encryption.key=${WEBHOOK_SECRET_ENCRYPTION_KEY}

# ---------- Async ----------
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50

# ---------- Logging ----------
# Fix: was DEBUG for both, which leaks request/header/token detail into logs.
# INFO is safe for normal operation; bump to DEBUG locally when you need it.
logging.level.org.springframework.security=INFO
logging.level.com.laxman.codereviewassistant=INFO
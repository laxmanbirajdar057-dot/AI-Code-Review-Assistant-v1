<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create account - CodeSense</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Create your account</h1>
    <p class="subtitle">Connect a repo and get AI review comments on every PR.</p>

    <div id="error" class="error-box hidden"></div>

    <form id="register-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Jane Doe" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="name@company.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" placeholder="At least 8 characters" required minlength="8" />
          <button type="button" class="toggle-eye" data-target="password" aria-label="Show password">👁</button>
        </div>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <div class="password-wrap">
          <input id="confirm-password" type="password" placeholder="Re-enter your password" required minlength="8" />
          <button type="button" class="toggle-eye" data-target="confirm-password" aria-label="Show password">👁</button>
        </div>
      </div>

      <button type="submit" class="primary full" id="submit-btn">Create account</button>
    </form>

    <p class="subtitle" style="margin-top: 16px;">
      Already have an account? <a class="link-text" href="/login">Sign in</a>
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm-password");

    // Eye toggle — works for both password fields via data-target
    document.querySelectorAll(".toggle-eye").forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");
        const input = document.getElementById(targetId);
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        btn.textContent = isHidden ? "🙈" : "👁";
        btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");

      // Client-side match check — before ever calling the API
      if (passwordInput.value !== confirmInput.value) {
        errorBox.textContent = "Passwords do not match.";
        errorBox.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      try {
        await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: passwordInput.value,
          }),
        });
        window.location.href = "/login";
      } catch (err) {
        errorBox.textContent = err.message || "Could not create account.";
        errorBox.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>

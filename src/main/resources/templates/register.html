<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create account - CodeSense</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Create your account</h1>
    <p class="subtitle">Connect a repo and get AI review comments on every PR.</p>

    <div id="error" class="error-box hidden"></div>

    <form id="register-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Jane Doe" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="name@company.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" required />
      </div>
      <button type="submit" class="primary full" id="submit-btn">Create account</button>
    </form>

    <p class="subtitle" style="margin-top: 16px;">
      Already have an account? <a class="link-text" href="/login.html">Sign in</a>
    </p>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      try {
        await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        window.location.href = "/login.html";
      } catch (err) {
        errorBox.textContent = err.message || "Could not create account.";
        errorBox.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
